# Manifest autonome du gateway : kubectl apply -f api-gateway.yaml
# Les marqueurs __JWT_ISSUER__ et __JWT_JWKS__ sont remplaces par get-cognito-values.ps1
apiVersion: v1
kind: Namespace
metadata:
  name: ms-shop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: ms-shop        
data:   
  # --- Securite : validation des jetons Cognito ---
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_20e166391"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_20e166391/.well-known/jwks.json"

  # --- Routage : nom du Service Kubernetes + port de chaque service ---
  PRODUCT_SERVICE_URL: "http://product-service:8080"
  ORDER_SERVICE_URL: "http://order-service:8081"
  INVENTORY_SERVICE_URL: "http://inventory-service:8082"

  # --- Observabilite : aucun backend dans le cluster (CloudWatch viendra plus tard) ---
  # Echantillonnage a 0 : aucune trace n'est exportee. A remonter quand X-Ray sera en place.
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"

  # --- Divers ---
  EUREKA_CLIENT_ENABLED: "false"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ms-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          # Image construite depuis notre code, chargee dans le cluster avec 'ctr images import'
          image: 000000000000.dkr.ecr.us-east-1.localhost:4566/ms-shop/api-gateway:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          # Toutes les variables viennent d'UNE seule ConfigMap
          envFrom:
            - configMapRef:
                name: api-gateway-config
          # tcpSocket : le gateway exige un jeton, un appel HTTP sur /actuator/health
          # pourrait renvoyer 401 et empecher le pod d'etre Ready
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ms-shop
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000