# inventory-service (RDS MySQL) dans le cluster
# Prerequis : api-gateway.yaml applique (il cree le namespace ms-shop) et le Secret inventory-db-credentials :
#   kubectl create secret generic inventory-db-credentials -n ms-shop --from-literal=username=<user RDS inventory> --from-literal=password=<mot de passe RDS inventory>
# Le marqueur __INVENTORY_RDS_ENDPOINT__ est a remplacer avant l'apply.
# Puis : kubectl apply -f inventory-service.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-service-config
  namespace: ms-shop
data:
  # Port impose ici : le Service ci-dessous vise 8082 quoi que dise application.properties
  SERVER_PORT: "8082"

  # --- Base de donnees : RDS (instance RDS dediee a inventory-service) ---
  SPRING_DATASOURCE_URL: "jdbc:mysql://172.25.0.2:7001/inventory_service"

  # Aucun backend d'observabilite dans le cluster pour l'instant
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
  # Le client Eureka est dans l'image : on le desactive
  EUREKA_CLIENT_ENABLED: "false"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-credentials  
  namespace: ms-shop        
type: Opaque
stringData:  
  username: inventory_user
  password: ChangeMe-Inventory-123  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ms-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: 000000000000.dkr.ecr.us-east-1.localhost:4566/ms-shop/inventory-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: inventory-service-config
          env:
            # Identifiants RDS : dans un Secret, jamais dans la ConfigMap
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: password
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: ms-shop
spec:
  selector:
    app: inventory-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082