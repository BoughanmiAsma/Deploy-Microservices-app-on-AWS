events {}

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cdn_cache:10m max_size=100m inactive=60m;


    # Le api-gateway dans EKS : conteneur du nœud k3s + NodePort du Service
    upstream api_gateway {
        server floci-aws-eks-ms-shop-eks:30900;
    }


    server {
        listen 80;
        server_name www.websitetemplate.test;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name www.websitetemplate.test;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # --- API : vers le gateway, jamais mise en cache ---
        location /api/ {
            proxy_pass http://api_gateway;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_cache off;
            add_header X-Cache-Status BYPASS;
        }        
        location /cognito/ {
            proxy_pass http://floci-floci-1:4566/;   # le slash final retire le préfixe /cognito/
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_cache off;
        }   
        location /cognito-idp/ {
            proxy_pass http://floci-floci-1:4566;   # sans slash final : le chemin /cognito-idp/... est conservé tel quel
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_cache off;
       }





        location / {
            rewrite ^/$ /index.html;

            proxy_pass http://s3-gateway;

            proxy_intercept_errors on;
            error_page 403 404 = /index.html;

            proxy_cache cdn_cache;
            proxy_cache_valid 200 10m;
            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}