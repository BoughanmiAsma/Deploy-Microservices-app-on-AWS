# CDN simule (Nginx) + S3 gateway, branches sur le reseau Docker de Floci.
# Variables a definir dans .env (en plus de BUCKET_NAME, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION) :
#   FLOCI_NETWORK=<nom du reseau Docker de Floci>     -> docker network ls
#   FLOCI_HOST=<conteneur Floci ou IP, ex. 172.25.0.2> -> endpoint S3 de Floci (port 4566)
services:
  s3-gateway:
    image: ghcr.io/nginxinc/nginx-s3-gateway/nginx-oss-s3-gateway:latest
    container_name: s3-gateway
    # Acces direct temporaire pour tester (a supprimer a la fin) :
    ports:
      - "127.0.0.1:8090:80"
    environment:
      S3_BUCKET_NAME: ${BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_SERVER: ${FLOCI_HOST:-172.25.0.2}
      S3_SERVER_PORT: 4566
      S3_SERVER_PROTO: http
      S3_REGION: ${AWS_REGION}
      S3_STYLE: path
      AWS_SIGS_VERSION: 4
      ALLOW_DIRECTORY_LIST: "false"
      PROVIDE_INDEX_PAGE: "true"
    networks:
      - default
      - floci

  nginx-front:
    image: nginx:stable
    container_name: nginx-front
    depends_on:
      - s3-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./nginx/certs:/etc/nginx/certs:ro"
    networks:
      - default
      - floci

networks:
  floci:
    external: true
    name: ${FLOCI_NETWORK}